<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="nocturne/styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
</helmet>
<header style="height:56px;box-sizing:border-box;border-bottom:1px solid var(--color-divider);background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);display:flex;justify-content:center">
  <div style="flex:1;max-width:{{ maxw }};padding:0 {{ pad }};display:flex;align-items:center;gap:40px">
    <div style="display:flex;align-items:baseline;gap:10px;flex:none">
      <span style="font-family:var(--font-heading);font-size:16px;letter-spacing:-.01em">Gurchon Hall</span>
      <span style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-500)">VtES</span>
    </div>
    <nav style="display:flex;gap:28px;height:100%;align-items:stretch">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <sc-if value="{{ t.active }}" hint-placeholder-val="{{ false }}">
          <span style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--color-text);box-shadow:inset 0 -2px 0 var(--color-accent)">{{ t.label }}<span style="font-size:11px;color:var(--color-neutral-500);border:1px solid var(--color-divider);border-radius:var(--radius-sm);padding:0 5px;line-height:17px">{{ t.key }}</span></span>
        </sc-if>
        <sc-if value="{{ t.inactive }}" hint-placeholder-val="{{ true }}">
          <span style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--color-neutral-400)" style-hover="color:var(--color-text)">{{ t.label }}<span style="font-size:11px;color:var(--color-neutral-600);border:1px solid var(--color-divider);border-radius:var(--radius-sm);padding:0 5px;line-height:17px">{{ t.key }}</span></span>
        </sc-if>
      </sc-for>
    </nav>
    <div style="margin-left:auto;display:flex;align-items:center;gap:20px">
      <sc-if value="{{ alert }}" hint-placeholder-val="{{ false }}">
        <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-accent-200)"><i class="ph-fill ph-warning-circle" style="font-size:16px;color:var(--color-accent-300)"></i>2 refusées · hors ligne</span>
      </sc-if>
      <div style="width:280px;height:34px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:var(--radius-md);border:1px solid var(--color-divider);background:var(--color-surface)">
        <i class="ph ph-magnifying-glass" style="font-size:16px;color:var(--color-neutral-500)"></i>
        <span style="font-size:13px;color:var(--color-neutral-500);flex:1">Chercher une carte</span>
        <span style="font-size:11px;color:var(--color-neutral-400);border:1px solid var(--color-divider);border-radius:var(--radius-sm);padding:0 6px;line-height:18px">/</span>
      </div>
    </div>
  </div>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:56},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;atelier&quot;,&quot;collection&quot;,&quot;decks&quot;,&quot;sync&quot;],&quot;default&quot;:&quot;atelier&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alert&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;wide&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'atelier';
    const wide = this.props.wide === true || this.props.wide === 'true';
    const defs = [['atelier','Atelier','G A'],['collection','Collection','G C'],['decks','Decks','G D'],['sync','Synchronisation','G S']];
    return {
      maxw: wide ? 'none' : '1200px',
      pad: wide ? '32px' : '0',
      alert: this.props.alert === true || this.props.alert === 'true',
      tabs: defs.map(([k, label, key]) => ({ label, key, active: k === a, inactive: k !== a })),
    };
  }
}
</script>
</body>
</html>
