<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Compte-rendu — feuille Réglages, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#161826}
a{color:#d2cefd}a:hover{color:#e7e5fe}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #9184d9;outline-offset:2px}
.sw{appearance:none;flex:none;width:46px;height:28px;border-radius:999px;background:#292b31;border:1px solid rgba(233,233,237,.16);position:relative;margin:0;cursor:pointer;transition:background 140ms ease-out}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#9397ab;transition:transform 140ms ease-out}
.sw:checked{background:#423a6a;border-color:#9184d9}
.sw:checked::after{transform:translateX(18px);background:#e7e5fe}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#161826;color:#e9e9ed;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;padding:16px 26px 26px;display:flex;flex-direction:column;gap:22px">

<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<h2 style="margin:0;font-size:26px;font-weight:500;letter-spacing:-.02em">Réglages</h2>
<a href="Gurchon%20Hall%20Compte-rendu.dc.html" aria-label="Fermer" style="width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:#e9e9ed;border-radius:8px">
<svg width="20" height="20" viewBox="0 0 256 256" aria-hidden="true"><path d="M200 56 56 200M56 56l144 144" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"></path></svg>
</a>
</div>

<label style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-top:1px solid rgba(233,233,237,.16);border-bottom:1px solid rgba(233,233,237,.16);cursor:pointer">
<span style="display:flex;flex-direction:column;gap:2px">
<span style="font-size:15px">Inclure les notes sur les adversaires</span>
<span style="font-size:12px;color:#9397ab">Prises en compte à la prochaine mise à jour.</span>
</span>
<input class="sw" type="checkbox" checked="{{notesOn}}" onChange="{{toggleNotes}}">
</label>

<button type="button" style="min-height:44px;padding:0 16px;border-radius:8px;border:1px solid rgba(233,233,237,.16);background:transparent;color:#e9e9ed;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px">
<svg width="16" height="16" viewBox="0 0 256 256" aria-hidden="true"><path d="M64 80V40h128v40M64 176H32V88h192v88h-32M64 152h128v64H64z" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="round"></path></svg>
Imprimer ou enregistrer en PDF</button>

<div style="display:flex;flex-direction:column;gap:10px">
<p style="margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9397ab">Lien public</p>
<p style="margin:0;font-size:13px;color:#b2b6ca">Toujours la dernière version. Les noms des adversaires et leurs decks y sont publics.</p>
<div style="display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 12px;border-radius:8px;background:#232532;box-shadow:0 0 0 1px #3f424d">
<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,monospace;font-size:13px;color:#cfd3e5">[adresse du lien public]</span>
<button type="button" style="flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(233,233,237,.16);background:transparent;color:#e9e9ed;font-size:13px">Copier</button>
</div>
<label style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;cursor:pointer">
<span style="font-size:14px">Montrer les versions antérieures</span>
<input class="sw" type="checkbox" checked="{{olderOn}}" onChange="{{toggleOlder}}">
</label>
<button type="button" style="align-self:flex-start;border:none;background:none;padding:0;min-height:44px;color:#d2cefd;font-size:13px">Purger le lien</button>
</div>

<div style="margin-top:auto;padding-top:14px;border-top:1px solid rgba(233,233,237,.16)">
<button type="button" style="border:none;background:none;padding:0;min-height:44px;color:#d2cefd;font-size:13px;display:inline-flex;align-items:center;gap:6px">
<svg width="14" height="14" viewBox="0 0 256 256" aria-hidden="true"><path d="M216 56H40M104 104v64M152 104v64M200 56v152H56V56M168 56V40H88v16" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"></path></svg>
Supprimer le compte-rendu…</button>
<p style="margin:0;font-size:12px;color:#9397ab">Les notes du tournoi et des parties restent.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { notesOn: true, olderOn: false }; }
  renderVals() {
    return { notesOn: this.state.notesOn, olderOn: this.state.olderOn,
      toggleNotes: () => this.setState({ notesOn: !this.state.notesOn }),
      toggleOlder: () => this.setState({ olderOn: !this.state.olderOn }) };
  }
}
</script>
</body>
</html>
