<p style="margin:0 0 8px;font-size:14px;line-height:1.5;text-wrap:pretty;max-width:640px">Premier tournoi avec la version aux Villein : sept exemplaires pour tenir le pool pendant que les Brujah se mettent en place. L&#x27;idée était de sortir deux vampires dès le troisième tour et d&#x27;aller chercher la proie aux .44 Magnum avant qu&#x27;elle ne s&#x27;installe.</p><p style="margin:0 0 8px;font-size:14px;line-height:1.5;text-wrap:pretty;max-width:640px">Bilan : la crypte tient, mais il manque une deuxième Line Brawl pour les tables où la proie se protège. Les Organized Resistance ont fait leur travail ; les Bait and Switch beaucoup moins, je les reverrai avant le prochain tournoi.</p>

</div><div style="margin-top:6px"><div style="display:grid;grid-template-columns:44px 170px minmax(0,1fr) 110px;column-gap:12px;padding:4px 8px;border-bottom:1px solid #111111;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#444444;font-size:10px"><span>Siège</span><span>Joueur</span><span>Deck</span><span>Position</span></div><div style="display:grid;grid-template-columns:44px 170px minmax(0,1fr) 110px;column-gap:12px;align-items:center;padding:3px 8px;min-height:24px;border-bottom:1px solid #9a9a9a;"><span style="font-weight:600">1</span><span>Inès</span><span><span style="display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="display:inline-flex;gap:5px;align-items:center"><span aria-hidden="true" style="font-family:'VTES Clans';font-size:15px;line-height:1">u</span>Tremere</span> <span>·</span> Wall <span>·</span> « Tour d&#x27;ivoire »</span></span><span></span></div><div style="display:grid;grid-template-columns:44px 170px minmax(0,1fr) 110px;column-gap:12px;align-items:center;padding:3px 8px;min-height:24px;border-bottom:1px solid #9a9a9a;"><span style="font-weight:600">2</span><span>Thomas</span><span><span style="display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="display:inline-flex;gap:5px;align-items:center"><span aria-hidden="true" style="font-family:'VTES Clans';font-size:15px;line-height:1">q</span>Malkavian</span> <span>·</span> Bleed</span></span><span style="font-size:12px;font-weight:600;border:1px solid #111111;border-radius:3px;padding:0 5px;justify-self:start">mon prédateur</span></div><div style="display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;padding:3px 8px 5px;border-bottom:1px solid #9a9a9a;font-size:13px"><span></span><span><span style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#444444;font-size:10px">Note sur Thomas · </span>Joue très vite, attention aux bleeds à 4.</span></div><div style="display:grid;grid-template-columns:44px 170px minmax(0,1fr) 110px;column-gap:12px;align-items:center;padding:3px 8px;min-height:24px;border-bottom:1px solid #9a9a9a;background:#ececec;"><span style="font-weight:600">3</span><span><span style="font-weight:700">Moi</span></span><span>Guns and shit (mostly guns)</span><span></span></div><div style="display:grid;grid-template-columns:44px 170px minmax(0,1fr) 110px;column-gap:12px;align-items:center;padding:3px 8px;min-height:24px;border-bottom:1px solid #9a9a9a;"><span style="font-weight:600">4</span><span>Paul</span><span><span style="display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="display:inline-flex;gap:5px;align-items:center"><span aria-hidden="true" style="font-family:'VTES Clans';font-size:15px;line-height:1">v</span>Ventrue</span> <span>·</span> Vote</span></span><span style="font-size:12px;font-weight:600;border:1px solid #111111;border-radius:3px;padding:0 5px;justify-self:start">ma proie</span></div></div><div style="margin-top:10px"><p style="margin:0 0 8px;font-size:14px;line-height:1.5;text-wrap:pretty;max-width:640px">Table à quatre, donc plus longue que prévu. Paul a ouvert avec deux princes Ventrue et un premier vote dès le troisième tour ; j&#x27;ai répondu par deux Line Brawl pour éviter qu&#x27;il ne s&#x27;installe, ce qui m&#x27;a coûté plus de sang que je ne l&#x27;aurais voulu. Derrière moi, Thomas a commencé à bleeder fort dès qu&#x27;il a eu trois vampires en jeu, et j&#x27;ai dû garder une Organized Resistance en main à chaque tour pour ne pas fondre.</p><p style="margin:0 0 8px;font-size:14px;line-height:1.5;text-wrap:pretty;max-width:640px">Le tournant arrive vers le sixième tour. Inès bloquait tout ce qui passait avec ses Tremere, mais elle ne menaçait personne : je l&#x27;ai laissée de côté et j&#x27;ai tout mis sur Paul. Deux .44 Magnum en jeu, un Concealed Weapon gardé pour le combat suivant, et ses princes sont tombés un par un. Il a tenté un dernier vote pour se refaire du pool, que Thomas a choisi de ne pas soutenir, et la table s&#x27;est ouverte d&#x27;un coup.</p><p style="margin:0 0 8px;font-size:14px;line-height:1.5;text-wrap:pretty;max-width:640px">Une fois Paul sorti, Inès est devenue ma proie. Sa défense tenait encore et je n&#x27;avais plus le pool pour l&#x27;attaquer de front ; j&#x27;ai joué la montre, une action par tour, en gardant les Diversion pour ses blocages. Pendant ce temps Thomas continuait de bleeder, et la partie s&#x27;est jouée sur la vitesse : lequel de nous deux allait sortir sa proie le premier, avant que l&#x27;autre ne le rattrape.</p><p style="margin:0 0 8px;font-size:14px;line-height:1.5;text-wrap:pretty;max-width:640px">C&#x27;est passé de justesse. Inès a fini par manquer de réactions et un dernier Line Brawl l&#x27;a fait tomber, ce qui m&#x27;a donné le deuxième point. Le temps s&#x27;est écoulé peu après, Thomas toujours en jeu : le demi-point de fin de temps est revenu à chacun des survivants, d&#x27;où mes 2,5 VP et la victoire de table. Sans les deux Organized Resistance du dernier tour, je ne serais pas allé jusque-là.</p><p style="margin:0 0 8px;font-size:14px;line-height:1.5;text-wrap:pretty;max-width:640px">À retenir : face à un prédateur qui bleede vite, les quatorze Organized Resistance ne sont pas de trop, et le deck souffre davantage contre un wall patient que contre un vote. Je testerai une version qui garde moins de Bait and Switch pour faire de la place à une deuxième Open War, et je relirai le timing des Diversion, que j&#x27;ai joués trop tôt deux fois dans la partie.</p></div></section>
