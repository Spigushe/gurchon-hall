<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="nocturne/styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
</helmet>
<nav style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:10px 6px 26px;background:var(--color-surface);border-top:1px solid var(--color-divider);font-family:var(--font-body)">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
    <sc-if value="{{ t.active }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--color-accent);font-size:11px;min-height:44px;justify-content:center;position:relative"><i class="ph-fill ph-{{ t.icon }}" style="font-size:22px;display:block"></i>{{ t.label }}</div>
    </sc-if>
    <sc-if value="{{ t.inactive }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--color-neutral-500);font-size:11px;min-height:44px;justify-content:center;position:relative;opacity:{{ t.op }}"><i class="ph ph-{{ t.icon }}" style="font-size:22px;display:block"></i>{{ t.label }}<sc-if value="{{ t.badge }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:4px;left:calc(50% + 8px);width:7px;height:7px;border-radius:999px;background:var(--color-accent)"></span></sc-if></div>
    </sc-if>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:82},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;atelier&quot;,&quot;collection&quot;,&quot;decks&quot;,&quot;parties&quot;],&quot;default&quot;:&quot;parties&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'atelier';
    const badge = this.props.badge === true || this.props.badge === 'true';
    const defs = [['atelier','Atelier','house'],['collection','Collection','stack'],['decks','Decks','cards'],['parties','Parties','trophy'],['chercher','Chercher','magnifying-glass']];
    return {
      tabs: defs.map(([k, label, icon]) => ({
        label, icon, active: k === a, inactive: k !== a,
        op: k === 'chercher' ? 0.45 : 1,
        badge: badge && k === 'atelier' && a !== 'atelier',
      })),
    };
  }
}
</script>
</body>
</html>
