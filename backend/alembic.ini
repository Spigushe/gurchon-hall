# Configuration Alembic du backend VtES.
#
# Les commandes se lancent depuis `backend/` :
#   uv run alembic revision --autogenerate -m "message"
#   uv run alembic upgrade head
#   uv run alembic downgrade base
#
# L'URL de connexion n'est volontairement pas écrite ici : `migrations/env.py`
# la lit via `app.db.session.database_url()`, donc via `DATABASE_URL` avec un
# repli SQLite. Une seule source de vérité pour l'application et les migrations.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
