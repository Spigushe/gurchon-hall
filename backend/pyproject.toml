[project]
name = "vtes-tracker-backend"
version = "0.1.0"
description = "API FastAPI du suivi VtES (pilote PWA offline-first, monorepo gurchon-hall)"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Les révisions Alembic sont écrites par `--autogenerate` : leurs appels
# `op.create_table(...)` dépassent souvent la limite de longueur et les
# reformater à la main serait défait à la prochaine génération. Le reste des
# règles, lui, s'applique.
"migrations/versions/*.py" = ["E501"]
